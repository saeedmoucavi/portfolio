<!--
  HIDDEN FORM — DO NOT DELETE.
  Netlify scans the raw HTML of the page to discover contact forms. Because the
  visible form is drawn by JavaScript, Netlify would never see it. This hidden
  copy is what registers the form with Netlify. The visible form posts to it.
-->
<form name="contact" netlify netlify-honeypot="bot-field" hidden>
  <input type="text" name="name">
  <input type="email" name="email">
  <input type="text" name="company">
  <textarea name="message"></textarea>
</form>

<script src="assets/js/main.js" defer></script>
</body>
