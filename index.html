<!-- Start-up sequence: a gear train turns while the machine "boots".
     Removed automatically once the page is ready. -->
<div class="loader" id="loader" aria-hidden="true">
  <div class="loader__sheet">
    <div class="loader__block">
      <span class="loader__label">SYSTEM START-UP</span>
      <span class="loader__brand">SM</span>
    </div>

    <svg class="loader__train" viewBox="0 0 320 140" aria-hidden="true">
      <g class="gearA"><g id="ld-gear-a"></g></g>
      <g class="gearB"><g id="ld-gear-b"></g></g>
      <g class="gearC"><g id="ld-gear-c"></g></g>
      <path class="loader__axis" d="M10 70h300"/>
    </svg>

    <div class="loader__cyl" aria-hidden="true">
      <span class="loader__cyl-body"><span class="loader__cyl-rod" id="loader-rod"></span></span>
      <span class="loader__port loader__port--a"></span>
      <span class="loader__port loader__port--b"></span>
    </div>

    <div class="loader__readout">
      <span class="loader__count" id="loader-count">000</span>
      <span class="loader__pct">%</span>
    </div>
  </div>
</div>
