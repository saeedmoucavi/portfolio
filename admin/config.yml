                fields:
                  - { name: "enabled", label: "Show", widget: "boolean", default: true }
                  - name: "icon"
                    label: "Icon"
                    widget: "select"
                    options: ["linkedin", "whatsapp", "telegram", "instagram", "grabcad", "website"]
                  - { name: "label", label: "Name", widget: "string" }
                  - { name: "url", label: "Web address", widget: "string" }

