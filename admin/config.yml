                    widget: "object"
                    label: "'Your name'"
                    fields:
                      - { name: "en", label: "English", widget: "string" }
                      - { name: "fa", label: "Persian", widget: "string" }
                  - name: "email"
                    widget: "object"
                    label: "'Your email'"
                    fields:
                      - { name: "en", label: "English", widget: "string" }
                      - { name: "fa", label: "Persian", widget: "string" }
                  - name: "company"
                    widget: "object"
                    label: "'Company'"
                    fields:
                      - { name: "en", label: "English", widget: "string" }
                      - { name: "fa", label: "Persian", widget: "string" }
                  - name: "message"
                    widget: "object"
                    label: "'Your message'"
                    fields:
                      - { name: "en", label: "English", widget: "string" }
                      - { name: "fa", label: "Persian", widget: "string" }
                  - name: "submit"
                    widget: "object"
                    label: "Send button"
                    fields:
                      - { name: "en", label: "English", widget: "string" }
                      - { name: "fa", label: "Persian", widget: "string" }
                  - name: "sending"
                    widget: "object"
                    label: "'Sending…'"
                    fields:
                      - { name: "en", label: "English", widget: "string" }
                      - { name: "fa", label: "Persian", widget: "string" }
                  - name: "success"
                    widget: "object"
                    label: "Success message"
                    fields:
                      - { name: "en", label: "English", widget: "text" }
                      - { name: "fa", label: "Persian", widget: "text" }
                  - name: "error"
                    widget: "object"
                    label: "Error message"
                    fields:
                      - { name: "en", label: "English", widget: "text" }
                      - { name: "fa", label: "Persian", widget: "text" }

              - name: "details"
                label: "Contact details"
                widget: "list"
                fields:
                  - { name: "enabled", label: "Show", widget: "boolean", required: false, default: true }
                  - { name: "type", label: "Icon", widget: "select", options: ["email", "phone", "location", "website"] }
                  - name: "label"
                    label: "Small label"
                    widget: "object"
                    fields:
                      - { name: "en", label: "English", widget: "string" }
                      - { name: "fa", label: "Persian", widget: "string" }
                  - { name: "value", label: "Text shown", widget: "string" }
                  - { name: "link", label: "Link (mailto:… , tel:… , or leave empty)", widget: "string", required: false }

              - name: "socials"
                label: "Social links"
